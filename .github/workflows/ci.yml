name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    name: Lint & syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Ruff lint
        working-directory: api
        run: ruff check .

      - name: Byte-compile check (fails fast on syntax errors)
        working-directory: api
        run: python -m py_compile api.py database.py create_user.py seed_data.py

      - name: Import sanity check
        working-directory: api
        env:
          JWT_SECRET_KEY: ci-test-secret
          INFLUX_URL: http://localhost:8086
          INFLUX_TOKEN: ci-test-token
          INFLUX_ORG: ci-org
          INFLUX_BUCKET: ci-bucket
        run: |
          python -c "import api; print('api.py imports OK, routes:', [r.path for r in api.app.routes])"

  automated-tests:
    name: Automated tests
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt

      - name: Install dependencies
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        working-directory: api
        env:
          JWT_SECRET_KEY: ci-test-secret
          INFLUX_URL: http://localhost:8086
          INFLUX_TOKEN: ci-test-token
          INFLUX_ORG: ci-org
          INFLUX_BUCKET: ci-bucket
        run: pytest tests/ -v

  docker-build:
    name: Docker build validation
    runs-on: ubuntu-latest
    needs: [lint-and-test, automated-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: false
          tags: vps-infra-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate docker-compose config
        run: docker compose config -q
        # Verified: full pipeline (lint, tests, docker build) passes in CI